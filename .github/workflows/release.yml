name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: EmailCrunch-windows.zip
            platform: windows
          - os: macos-latest
            artifact: EmailCrunch-macos.zip
            platform: macos
          - os: ubuntu-latest
            artifact: EmailCrunch-linux.zip
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxkbcommon-x11-0 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller email_crunch.spec --noconfirm

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/EmailCrunch -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS/Linux)
        if: matrix.platform != 'windows'
        run: zip -r ${{ matrix.artifact }} dist/EmailCrunch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Email Crunch ${{ github.ref_name }}"
          body: |
            ## Email Crunch ${{ github.ref_name }}

            Cross-platform bulk document email extractor.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `EmailCrunch-windows.zip` |
            | macOS    | `EmailCrunch-macos.zip` |
            | Linux    | `EmailCrunch-linux.zip` |

            ### Install & Run
            1. Download the zip for your platform
            2. Extract and run `EmailCrunch` (or `EmailCrunch.exe` on Windows)

            See [README.md](README.md) for full documentation.
          files: artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
